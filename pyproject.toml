[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regraph"
version = "0.1.0"
description = "ReGraph: Iterative Graph Reading for Open-Ended Reasoning with LLMs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers==4.57.3",
    "torch-geometric>=2.6",
    "sentence-transformers>=3.0",
    "datasets>=2.19",
    "numpy",
    "pandas",
    "scikit-learn",
    "PyYAML",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llama: tests that load the real meta-llama/Llama-3.1-8B-Instruct checkpoint (set REGRAPH_LLAMA_TESTS=1)",
    "slow: long-running tests",
]
